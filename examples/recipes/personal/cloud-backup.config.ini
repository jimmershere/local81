# =============================================================================
# Local-81 RECIPE — "Back up my personal files to the cloud"
# =============================================================================
# A 3-2-1-friendly personal backup, push-based over SSH + rsync. You keep ONE
# readable config; Local-81 plans the copy, shows you exactly what will move
# (dry-run first), backs up anything it would overwrite, and journals the run.
#
# Topology (no agent on any target):
#   control node (your laptop)  --ssh+rsync-->  a "vault" host you can ssh to
#   the vault host has rclone configured with your cloud remotes
#   (gdrive:, dropbox:, s3:) and a post-deploy hook fans the staged copy out
#   to whichever cloud(s) you chose.
#
# The vault host can be a $5 VPS, a home NAS, or even localhost — anything with
# rsync + rclone. Local-81 never sees your cloud tokens: rclone owns those on
# the vault, referenced by name, never written into this file (secrets-never-
# at-rest is a Local-81 rule, not a nicety).
#
# Usage:
#   local81 --profile cloud-backup doctor --fleet      # prove vault is reachable
#   local81 --profile cloud-backup plan --summary      # preview the copy
#   local81 --profile cloud-backup deploy --latest --dry-run   # show, change nothing
#   local81 --profile cloud-backup deploy --latest --execute   # actually back up
#   local81 --profile cloud-backup history             # every run, on disk
# =============================================================================

[local81]
version = 0.1
project = personal-backup
default_scope = documents
state_dir = .local81/state
plans_dir = .local81/plans
runs_dir = .local81/runs
logs_dir = .local81/logs
lock_file = .local81/local81.lock
require_plan_for_deploy = true
fail_fast = true
max_parallel = 2
shell = /usr/bin/bash

[tools]
ssh = /usr/bin/ssh
rsync = /usr/bin/rsync
find = /usr/bin/find

[defaults]
# -az = archive + compress; --partial resumes big files; keep a backup of
# anything we'd overwrite so a bad sync is never destructive.
rsync_opts = -az --partial
backup = true
backup_suffix = .bkp
remote_mkdir = true
dry_run_default = true

[access]
allowed_users = me
deny_root = true
allow_remote_cmd = false

# --- What to back up --------------------------------------------------------
# One scope per "thing you care about". Edit source_dir to your real paths.
# servers = vault  -> resolves to the [host] you define in the YAML side-config
# (see cloud-backup.hosts.yaml), e.g. an ssh alias "vault".

[scope "documents"]
enabled = true
source_dir = ~/Documents
target_dir = /srv/vault/documents
servers = vault
discovery = mtime_since_last_success
rsync_opts = -az --partial --delete
backup = true
backup_suffix = .bkp

[scope "photos"]
enabled = true
source_dir = ~/Pictures
target_dir = /srv/vault/photos
servers = vault
discovery = mtime_since_last_success
# photos are immutable history -> never --delete, never overwrite
rsync_opts = -az --partial --ignore-existing
backup = false

[scope "desktop"]
enabled = true
source_dir = ~/Desktop
target_dir = /srv/vault/desktop
servers = vault
discovery = mtime_since_last_success
rsync_opts = -az --partial --delete
backup = true
backup_suffix = .bkp

# --- Fan-out to the cloud ---------------------------------------------------
# A post-deploy hook on the vault pushes the freshly-staged copy to your chosen
# cloud remote(s). rclone owns the credentials; pick the remote by name.
# Install the hook with:  local81 hooks list   (then drop the script in place)
#
#   ~/.local81/hooks/post-deploy.d/10-rclone-fanout.sh
#   ------------------------------------------------------------------
#   #!/usr/bin/env bash
#   set -euo pipefail
#   # CLOUD_REMOTE is one of: gdrive  dropbox  s3   (set per run via env)
#   : "${CLOUD_REMOTE:?pick gdrive|dropbox|s3}"
#   ssh vault "rclone sync /srv/vault \"${CLOUD_REMOTE}:backup/$(hostname)\" \
#       --transfers 8 --fast-list --log-level INFO"
#   ------------------------------------------------------------------
#
# Then:  CLOUD_REMOTE=gdrive local81 --profile cloud-backup deploy --latest --execute
