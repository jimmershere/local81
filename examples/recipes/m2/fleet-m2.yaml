# Generated by local81 m2 — an M2 stack fleet catalog.
# Hosts grouped by name marker: m2in->postgres, m2or->oracle, m2tr->mq, m2->app.
# Ports are unique placeholders — set each to the host's real service port.
schema: local81.recipes.v1
name: m2-fleet
description: M2 JBoss/Oracle/PostgreSQL/MQ stack fleet (7 hosts).

categories:
  - key: discover
    title: Discover & Observe
    options:
      - { key: doctor,    label: "Fleet readiness",      command: "doctor --fleet" }
      - { key: pull_logs, label: "Pull stack logs",      command: "pull-logs" }
      - { key: db_doctor, label: "Database readiness",   command: "db doctor" }
      - { key: compliance, label: "Compliance scan",     command: "compliance report --scope {scope}" }
  - key: deploy
    title: Deploy & Release
    options:
      - { key: plan,    label: "Plan — preview",  command: "plan --summary" }
      - { key: dryrun,  label: "Dry-run",         command: "deploy --latest --dry-run --forks {forks}" }
      - { key: execute, label: "Deploy",          command: "deploy --latest --forks {forks}", mutating: true }

parameters:
  - { key: forks, type: int,  default: 5 }
  - { key: scope, type: enum, default: access, choices: [access, files, all] }

groups:
  - { key: all, label: "All M2 hosts", members: [a70lspalm2ap001, a70lspalm2ap002, a70lspalm2in001, a70lspalm2in002, a70lspalm2or001, a70lspalm2tr001, a70lspalm2tr002] }
  - { key: m2_postgres, label: "M2 PostgreSQL 17 DB hosts (m2in*)", members: [a70lspalm2in001, a70lspalm2in002] }
  - { key: m2_oracle, label: "M2 Oracle DB hosts (m2or*)", members: [a70lspalm2or001] }
  - { key: m2_mq, label: "M2 IBM MQ queue-manager hosts (m2tr*)", members: [a70lspalm2tr001, a70lspalm2tr002] }
  - { key: m2_app, label: "M2 JBoss/Java application hosts", members: [a70lspalm2ap001, a70lspalm2ap002] }

recipes:
  - key: a70lspalm2ap001
    title: a70lspalm2ap001 (m2-app)
    role: m2-app
    alias: a70lspalm2ap001
    port: 2810
    group: m2_app
    build: { base: debian:12-slim, packages: [], workload: '' }
    deploy: { target_dir: /app }
    health: { command: "test -d /var/www/html/vhosts && echo vhosts-present || true" }
    test: { probe: "test -d /app/engin/palmed && test -d /app/smartxfr" }
  - key: a70lspalm2ap002
    title: a70lspalm2ap002 (m2-app)
    role: m2-app
    alias: a70lspalm2ap002
    port: 2811
    group: m2_app
    build: { base: debian:12-slim, packages: [], workload: '' }
    deploy: { target_dir: /app }
    health: { command: "test -d /var/www/html/vhosts && echo vhosts-present || true" }
    test: { probe: "test -d /app/engin/palmed && test -d /app/smartxfr" }
  - key: a70lspalm2in001
    title: a70lspalm2in001 (m2-postgres)
    role: m2-postgres
    alias: a70lspalm2in001
    port: 2812
    group: m2_postgres
    build: { base: debian:12-slim, packages: [], workload: '' }
    deploy: { target_dir: /app }
    health: { command: "systemctl is-active postgresql-17 2>/dev/null || true" }
    test: { probe: "test -d /var/lib/pgsql/17/data || test -d /var/lib/postgresql/17/main" }
  - key: a70lspalm2in002
    title: a70lspalm2in002 (m2-postgres)
    role: m2-postgres
    alias: a70lspalm2in002
    port: 2813
    group: m2_postgres
    build: { base: debian:12-slim, packages: [], workload: '' }
    deploy: { target_dir: /app }
    health: { command: "systemctl is-active postgresql-17 2>/dev/null || true" }
    test: { probe: "test -d /var/lib/pgsql/17/data || test -d /var/lib/postgresql/17/main" }
  - key: a70lspalm2or001
    title: a70lspalm2or001 (m2-oracle)
    role: m2-oracle
    alias: a70lspalm2or001
    port: 2814
    group: m2_oracle
    build: { base: debian:12-slim, packages: [], workload: '' }
    deploy: { target_dir: /app }
    health: { command: "test -f /etc/oratab && echo oratab-present || true" }
    test: { probe: "test -d /opt/oracle || test -d /u01/app/oracle" }
  - key: a70lspalm2tr001
    title: a70lspalm2tr001 (m2-mq)
    role: m2-mq
    alias: a70lspalm2tr001
    port: 2815
    group: m2_mq
    build: { base: debian:12-slim, packages: [], workload: '' }
    deploy: { target_dir: /app }
    health: { command: "command -v dspmq >/dev/null 2>&1 && dspmq 2>/dev/null || true" }
    test: { probe: "test -d /var/mqm" }
  - key: a70lspalm2tr002
    title: a70lspalm2tr002 (m2-mq)
    role: m2-mq
    alias: a70lspalm2tr002
    port: 2816
    group: m2_mq
    build: { base: debian:12-slim, packages: [], workload: '' }
    deploy: { target_dir: /app }
    health: { command: "command -v dspmq >/dev/null 2>&1 && dspmq 2>/dev/null || true" }
    test: { probe: "test -d /var/mqm" }
