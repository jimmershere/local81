[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local81"
version = "0.1.0"
description = "Local-81 Python control plane"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
# Stdlib-first: PyYAML is the ONLY required third-party runtime dependency. For
# air-gapped / pip-less builds it is vendored under vendor/yaml and bundled into
# a single zipapp by `make zipapp` (see packaging/zipapp/README.md). Optional
# extras (e.g. the Textual TUI) live under [project.optional-dependencies] so the
# core offline install stays dependency-light.
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
local81 = "local81.cli:main"

[project.optional-dependencies]
# Optional Textual TUI front-end. Not required by the core CLI and not bundled
# into the air-gapped zipapp; install with `pip install local81[tui]` where
# network/pip is available.
tui = [
  "textual>=8.2.5",
]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]
